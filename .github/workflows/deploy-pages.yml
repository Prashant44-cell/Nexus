name: Deploy portals to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client-app/package-lock.json
            admin-app/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build customer and admin portals
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$VITE_API_BASE_URL" ]]; then
            echo "::warning::VITE_API_BASE_URL is not set; the portals will publish, but backend-dependent features will remain unavailable."
          fi

          BASE_PATH="/${GITHUB_REPOSITORY#*/}/"

          npm --prefix client-app ci
          npm --prefix client-app run build -- --base "$BASE_PATH"

          npm --prefix admin-app ci
          npm --prefix admin-app run build -- --base "${BASE_PATH}admin/"

          mkdir -p client-app/dist/admin
          cp -R admin-app/dist/. client-app/dist/admin/
          touch client-app/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: client-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
