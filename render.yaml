services:
  - type: web
    name: nexus-blockbank
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_SIGNUP_ENABLED
        value: "false"
      - key: WEB3_DEMO_AUTH_ENABLED
        value: "false"
      - key: TOKEN_TTL_MINUTES
        value: "60"
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://nexus-blockbank.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: superadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
